# The merge gate: every PR and every push to main runs the same checks
# as the local `verify` skill on both supported OSes and Pythons.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Report every cell: an OS- or version-specific failure should not
      # hide behind the first one to fail.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv is pinned to the version the lockfile was written with;
      # uv_build in pyproject.toml is held below 0.13 to match.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.20"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - id: sync
        run: uv sync --frozen

      # python-version sets UV_PYTHON, which overrides .python-version.
      # Fail rather than quietly test 3.12 twice if that ever stops.
      - name: Check the interpreter is Python ${{ matrix.python }}
        env:
          WANT: ${{ matrix.python }}
        run: |
          got=$(uv run --frozen python -c \
            'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "Python $got"
          test "$got" = "$WANT"

      # The checks below run even when an earlier one fails, so one run
      # reports every problem, as the local `verify` skill does.
      - name: ruff format --check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen ruff format --check .

      - name: ruff check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen ruff check .

      - name: pyright
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen pyright

      - name: pytest
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen pytest
